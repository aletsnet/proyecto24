<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Edición - Ticket</title>

```
<link rel="stylesheet" href="../../css/ticket.css">
```

</head>

<body>

<div class="contenedor">

```
<!-- 🔥 PANEL IZQUIERDO -->
<div class="panel">
    <h2>Modo Edición</h2>

    <div class="grupo-undo-redo">
        <button class="btn-undo-redo" onclick="undo()">↺</button>
        <button class="btn-undo-redo" onclick="redo()">↻</button>
    </div>

    <button id="btnEditar" onclick="activarEdicion()">📝 Editar Ticket</button>
    <button id="btnProducto" onclick="recargarProductos()">🛒 Importar Venta</button>
    <button id="btnGuardar" onclick="guardarTicketPDF()">💾 Guardar PDF</button>
    <button id="btnImprimir" onclick="imprimir()">🖨️ Imprimir</button>
</div>


<!-- 🔥 ÁREA GRIS -->
<div class="area-ticket">

    <!-- ✅ TOAST AHORA ESTÁ EN EL LUGAR CORRECTO -->
    <div id="mensajeFlotante">⏳ Procesando...</div>


    <!-- 🔥 TICKET -->
    <div class="ticket" id="ticket">

        <img src="../../../src-tauri/icons/image.png" class="logo" alt="Logo">

        <div id="contenido" contenteditable="false">

            <p style="text-align:center;font-weight:bold;">¡BIENVENIDO!</p>

            <p style="font-size:12px;">Fecha: <span id="fecha"></span></p>
            <p style="font-size:12px;">Atiende: Admin</p>
            <p style="font-size:12px;">Caja: 001</p>

            <hr>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cant</th>
                        <th>Precio</th>
                        <th>Sub.</th>
                    </tr>
                </thead>
                <tbody id="tbodyProductos"></tbody>
            </table>

            <div style="text-align:right;">
                <p><b id="total">Total: $0.00</b></p>
                <p id="pago">Pago efectivo: $0.00</p>
                <p id="cambio">Cambio: $0.00</p>
            </div>

            <hr>

            <p style="text-align:center;font-size:11px;">
                ¡Gracias por su compra!<br>
                vuelva pronto!
            </p>

        </div>
    </div>
</div>
```

</div>

<script src="../../js/controlls/ticket.js"></script>

</body>
</html>
