
    <title>Corte de Caja</title>



<body onload="corte.loadView()">

<div class="container-fluid p-4">

    <!-- ENCABEZADO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">
            <i class="fas fa-cash-register"></i> Corte de Caja
        </h3>
        <span class="text-muted">
            Inicio: <strong id="horaInicio">--:--</strong>
        </span>
    </div>

    <div class="row">

        <!-- RESUMEN -->
        <div class="col-lg-4">
            <div class="card shadow-sm mb-3">
                <div class="card-body">

                    <h5 class="fw-bold mb-3">Resumen de Pagos</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Efectivo</span>
                        <span class="badge bg-success badge-pago" id="efectivo">$0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Tarjeta</span>
                        <span class="badge bg-primary badge-pago" id="tarjeta">$0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Transferencia</span>
                        <span class="badge bg-warning text-dark badge-pago" id="trasferencia">$0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Otros</span>
                        <span class="badge bg-secondary badge-pago" id="otros">$0.00</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between card-total">
                        <span>Total Venta</span>
                        <span id="totalVenta">$0.00</span>
                    </div>

                </div>
            </div>

            <!-- ACCIONES -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <button class="btn btn-danger w-100 mb-2"
                            onclick="corte.cerrarCaja()">
                        <i class="fas fa-lock"></i> Cerrar Caja
                    </button>
                </div>
            </div>
        </div>

        <!-- MOVIMIENTOS -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">

                    <h5 class="fw-bold mb-3">Movimientos del Corte</h5>

                    <div class="table-responsive">
                        <table class="table table-hover tabla-movimientos">
                            <thead class="table-light">
                                <tr>
                                    <th>Hora</th>
                                    <th>Venta</th>
                                    <th>Método</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="tablaMovimientos">
                                <!-- JS -->
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
