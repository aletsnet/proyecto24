<h3>Inventarios</h3>
<div class="row">
    <div class="col-md-12 text-end mb-3">
        <button class="btn btn-primary" onclick="cinventarios.abrirFormato()">
            <i class="fa fa-download"></i> Abrir Formato de Importación
        </button>
        <button class="btn btn-primary" onclick="cinventarios.selectFile()">
            <i class="fa fa-plus-circle"></i> Importar Inventario

        <button class="btn btn-success" onclick="cinventarios.exportar()">
            <i class="fa fa-file-export"></i> Exportar Inventario
        </button>
    </div>
</div>
<table id="tinventarios" class="table table-striped">
</table>
